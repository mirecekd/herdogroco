[project]
name = "herdogroco"
version = "0.1.0"
description = "Grok connector (remote MCP + OAuth) for a local Hermes Agent profile"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
