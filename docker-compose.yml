services:
  herdogroco:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: ghcr.io/mirecekd/herdogroco:latest
    container_name: herdogroco
    restart: unless-stopped

    # Host networking is used because the Hermes Agent API server listens on
    # 127.0.0.1:8642 of the host, which a bridge-networked container cannot
    # reach. Because of host mode there is no "ports:" mapping - the app
    # listens directly on the host at PORT.
    network_mode: host

    env_file:
      - .env
    environment:
      # With host networking, bind to loopback only: the Caddy reverse proxy
      # on the same host is the single public entry point.
      - HOST=127.0.0.1
      - PORT=${PORT:-8130}

    volumes:
      # OAuth state: registered clients, token hashes and the pairing code.
      # The container runs as uid 1000, so this directory must be writable
      # by that user.
      - ./data:/app/data
